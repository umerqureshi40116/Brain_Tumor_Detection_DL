<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="description" content="NeuroScan Pro - Professional Brain MRI Analysis Tool" />
  
  <title>NeuroScan Pro - Clinical Brain MRI Analysis</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
    }

    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #f3f4f6;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1f2937;
    }

    #root {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #f3f4f6;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Focus styles */
    button:focus,
    input:focus {
      outline: 2px solid #0ea5e9;
      outline-offset: 2px;
    }

    /* Loading animation */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Medical color variables */
    :root {
      --color-primary: #0ea5e9;
      --color-secondary: #06b6d4;
      --color-success: #10b981;
      --color-warning: #f97316;
      --color-danger: #dc2626;
      --color-info: #7c3aed;
      --color-gray: #6b7280;
      --color-light-gray: #f3f4f6;
      --color-border: #e5e7eb;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <noscript>
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: system-ui; background: #f3f4f6;">
      <div style="text-align: center; padding: 40px;">
        <div style="font-size: 48px; margin-bottom: 20px;">⚠</div>
        <h1 style="font-size: 24px; margin-bottom: 10px; color: #1f2937;">JavaScript Required</h1>
        <p style="color: #6b7280; font-size: 16px;">NeuroScan Pro requires JavaScript to be enabled. Please enable it in your browser settings.</p>
      </div>
    </div>
  </noscript>
</body>
</html>
